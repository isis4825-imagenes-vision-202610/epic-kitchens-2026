[project]
name = "epic-kitchens-mir"
version = "0.1.0"
description = "EPIC-KITCHENS-100 Multi-Instance Retrieval Challenge 2026"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
    "timm",
    "einops",
    "decord",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "hydra-core",
    "omegaconf",
    "pydantic",
    "rich",
    "loguru",
    "wandb",
    "tensorboard",
    "matplotlib",
    "seaborn",
    "plotly",
    "av",
    "ffmpeg-python",
    "nltk",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis",
    "pre-commit",
    "ipython",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM", "TCH"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"
